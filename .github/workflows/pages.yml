name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fix base paths for project pages
        run: |
          # Ensure relative asset paths work under /jw-ascolta/
          node -e "
          const fs=require('fs');
          const p='dist/index.html';
          let h=fs.readFileSync(p,'utf8');
          h=h.replaceAll('/assets/','./assets/').replaceAll('href=\"/favicon','href=\"./favicon').replaceAll('href=\"/apple','href=\"./apple').replaceAll('href=\"/manifest','href=\"./manifest');
          fs.writeFileSync(p,h);
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
